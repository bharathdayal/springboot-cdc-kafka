############################################
# SERVER CONFIG
############################################
server.port=8095
spring.application.name=cdc

############################################
# KAFKA CONFIG
############################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cdc-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Optional: increase max poll size for faster batch processing
spring.kafka.consumer.max-poll-records=200


############################################
# DATABASE CONFIG (MySQL)
###########################################

############################################################
# SOURCE DATABASE (MySQL ? Debezium reads from this DB)
############################################################
source.mysql.host=localhost
source.mysql.port=3306
source.mysql.database=cdc
source.mysql.user=debezium
source.mysql.password=#####


# NOTE:
# Your Spring Boot app DOES NOT use this JDBC.
# This is only for Debezium connector registration JSON.

############################################################
# DOWNSTREAM DATABASE (Spring Boot consumer writes here)
############################################################
downstream.mysql.host=localhost
downstream.mysql.port=3306
downstream.mysql.database=consumerdb
downstream.mysql.user=consumer
downstream.mysql.password=####


############################################################
# Spring Datasource (POINT TO DOWNSTREAM DB)
############################################################
spring.datasource.url=jdbc:mysql://${downstream.mysql.host}:${downstream.mysql.port}/${downstream.mysql.database}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${downstream.mysql.user}
spring.datasource.password=${downstream.mysql.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

############################################
# HIKARI POOL CONFIG
############################################
spring.datasource.hikari.pool-name=cdc-Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.transaction-isolation=TRANSACTION_REPEATABLE_READ

############################
# DEBEZIUM / KAFKA CONNECT
# REST endpoint for your Kafka Connect (Debezium) instance
# Example: if you run Kafka Connect locally on port 8083 (default)
############################
debezium.connect.url=http://localhost:8083
debezium.connector.name=inventory-connector
# logical name for server that will prefix topic names, e.g. dbserver1.cdc.customers
debezium.database.server.name=dbserver1
debezium.database.hostname=${source.mysql.host}
debezium.database.port=${source.mysql.port}
debezium.database.user=${source.mysql.user}
debezium.database.password=${source.mysql.password}
debezium.database.include.list=${source.mysql.database}
# comma-separated tables; set to your table(s)
debezium.table.include.list=${source.mysql.database}.customers
# optional: kafka topic used to store DB history (schema changes)
debezium.database.history.kafka.topic=schema-changes.${source.mysql.database}
# Debezium connector tasks
debezium.tasks.max=1
debezium.include.schema.changes=true
debezium.decimal.handling.mode=double
topic.prefix=dbserver1
schema.history.internal.kafka.topic=schema-changes.cdc
debezium.topic=${topic.prefix}.cdc.customers

############################
# CONNECTOR REGISTRATION (retry behavior for registrar)
############################
debezium.registrar.enabled=true
debezium.registrar.retries=3
debezium.registrar.retry-delay-ms=2000

############################################
# ACTUATOR / METRICS CONFIG
############################################
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.metrics.enable.hikaricp=true

############################################
# LOGGING CONFIG
############################################
logging.level.root=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.example.cdc=DEBUG

# DLT topic suffix
app.kafka.dlt-suffix=-dlt